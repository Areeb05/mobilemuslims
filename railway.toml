[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

# Do not set NODE_ENV=production for the build phase. With production mode, npm ci
# skips devDependencies, so client (tsc, vite) and server (tsc) are missing → exit 127.

[deploy]
startCommand = "cd server && npm run start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production]
NODE_ENV = "production"
CLIENT_URL = "${{RAILWAY_STATIC_URL}}"

# Note: GOOGLE_CREDENTIALS_JSON should be set as a Railway secret in the dashboard
# Do not include sensitive credentials in config files
