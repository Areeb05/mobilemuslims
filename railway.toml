[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[build.env]
NODE_ENV = "production"

[deploy]
startCommand = "cd server && npm run start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments.production]
NODE_ENV = "production"
CLIENT_URL = "${{RAILWAY_STATIC_URL}}"

# Note: GOOGLE_CREDENTIALS_JSON should be set as a Railway secret in the dashboard
# Do not include sensitive credentials in config files
